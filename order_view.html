<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            background: #c9a961;
            color: #000;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 24px;
        }

        .header-label {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .header-time {
            font-size: 0.85rem;
            opacity: 0.75;
            margin-top: 4px;
        }
        h3 {
            color: #c9a961;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 16px;
        }
        .item {
            background: #1a1a1a;
            padding: 18px 20px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-left: 4px solid #c9a961;
        }
        .item-qty {
            background: #c9a961;
            color: #000;
            min-width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        .item-name {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.3;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty i {
            font-size: 3rem;
            display: block;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .footer {
            text-align: center;
            color: #444;
            font-size: 0.75rem;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #1a1a1a;
        }

        /* ============================================
           🎯 ÇIKIŞ BUTONU
           ============================================ */
        .exit-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(220, 38, 38, 0.9);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(220, 38, 38, 0.5);
            -webkit-tap-highlight-color: transparent;
        }

        .exit-btn:hover {
            background: rgba(239, 68, 68, 1);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.7);
        }

        .exit-btn:active {
            transform: scale(0.92);
            background: rgba(185, 28, 28, 1);
        }

        /* Mobil uyum */
        @media (max-width: 400px) {
            .exit-btn {
                top: 14px;
                right: 14px;
                width: 44px;
                height: 44px;
                font-size: 1.2rem;
            }
        }

        /* Alt kısımda da bir çıkış butonu (büyük) */
        .exit-btn-bottom {
            display: block;
            width: 100%;
            margin-top: 30px;
            padding: 18px;
            background: rgba(220, 38, 38, 0.15);
            color: #ef4444;
            border: 2px solid rgba(220, 38, 38, 0.4);
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .exit-btn-bottom:hover {
            background: rgba(220, 38, 38, 0.9);
            color: #fff;
            border-color: rgba(220, 38, 38, 1);
        }

        .exit-btn-bottom:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- 🎯 SAĞ ÜST KÖŞE: Kapat butonu -->
    <button class="exit-btn" onclick="exitPage()" aria-label="Закрыть">✕</button>

    <div class="container" id="app">
        <div class="empty">
            <div>⏳</div>
            <p>Загрузка...</p>
        </div>
    </div>

    <script>
        // URL hash'ten veriyi çek
        function getData() {
            const hash = location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const encoded = params.get('d');

            if (!encoded) return null;

            try {
                const json = decodeURIComponent(escape(atob(encoded)));
                return JSON.parse(json);
            } catch (e) {
                console.error('Parse error:', e);
                return null;
            }
        }

        function render() {
            const data = getData();
            const app = document.getElementById('app');

            if (!data) {
                app.innerHTML = `
                    <div class="empty">
                        <div>❌</div>
                        <p>Некорректный QR код</p>
                    </div>
                `;
                return;
            }

            const items = data.i || [];
            const time = data.ts ? new Date(data.ts * 1000) : new Date();
            const timeStr = time.getHours().toString().padStart(2, '0') + ':' +
                            time.getMinutes().toString().padStart(2, '0');

            if (items.length === 0) {
                app.innerHTML = `
                    <div class="empty">
                        <div>📭</div>
                        <p>Пустой список</p>
                    </div>
                `;
                return;
            }

            let itemsHtml = '';
            items.forEach(item => {
                itemsHtml += `
                    <div class="item">
                        <div class="item-qty">${item.q || 1}</div>
                        <div class="item-name">${escapeHtml(item.n || '')}</div>
                    </div>
                `;
            });

            app.innerHTML = `
                <div class="header">
                    <div class="header-label">Заказ</div>
                    <div class="header-time">${timeStr}</div>
                </div>

                <h3>🍽️ Блюда (${items.length})</h3>

                ${itemsHtml}

                <!-- 🎯 ALT KISIMDA BÜYÜK ÇIKIŞ BUTONU -->
                <button class="exit-btn-bottom" onclick="exitPage()">
                    ✕ Закрыть заказ
                </button>

                <div class="footer">
                    Giotto Menu · ${timeStr}
                </div>
            `;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 🎯 Sayfayı kapatma fonksiyonu
        function exitPage() {
            const confirmed = confirm('Закрыть заказ?');
            if (!confirmed) return;

            // 1. Sayfayı temizle
            document.getElementById('app').innerHTML = `
                <div class="empty">
                    <div>✅</div>
                    <p>Заказ закрыт</p>
                    <p style="font-size: 0.8rem; margin-top: 12px;">Можно отсканировать следующий QR</p>
                </div>
            `;

            // 2. URL hash'ini temizle (adres çubuğundan veri gitsin)
            if (history.replaceState) {
                history.replaceState(null, '', location.pathname);
            } else {
                location.hash = '';
            }

            // 3. Pencereyi kapatmayı dene (mobil uygulamada çalışabilir)
            setTimeout(() => {
                try {
                    window.close();
                } catch (e) {
                    // Çoğu tarayıcı pencereyi kapatmaz — sorun değil
                    console.log('Pencere kapatılamadı, sayfa temizlendi');
                }
            }, 500);
        }

        window.addEventListener('hashchange', render);
        render();
    </script>
</body>
</html>
